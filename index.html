<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f7f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081417" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ciclo: do crédito ao próximo crédito. Saldo dos cartões de vale-alimentação, refeição e multibenefício da família, com leitura de cupom fiscal e cofre de senhas.">
<title>Ciclo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>try { var t = localStorage.getItem("ciclo-tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar" id="appbar">
  <div class="appbar-in">
    <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M35.3 15.5A14 14 0 1 0 38 24" fill="none" stroke="#7fe0d0" stroke-width="5.5" stroke-linecap="round"/><circle cx="35.6" cy="15.6" r="4.6" fill="#ffb547"/></svg></div><span class="brand-name" id="brandName">Ciclo</span></div>
    <div class="topright">
      <button class="pill accent" id="installBtn" hidden>Instalar</button>
      <button class="pill lock" id="lockBtn" hidden aria-label="Trancar o cofre"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>Trancar cofre</button>
      <button class="iconbtn ghost" id="eyeBtn" aria-label="Esconder valores" aria-pressed="false">
        <svg class="eye-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a10.6 10.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="wrap" id="app">
  <div id="view"><div class="empty">Carregando…</div></div>
</main>
<nav class="tabbar" id="tabbar" hidden aria-label="Navegação principal">
  <div class="tabbar-in">
    <button class="tab" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Início</span></button>
    <button class="tab" data-tab="extrato"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Extrato</span></button>
    <button class="tab-plus" id="plusBtn" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <button class="tab" data-tab="cofre"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Cofre</span></button>
    <button class="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Ajustes</span></button>
  </div>
</nav>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script src="vendor/tesseract/tesseract.min.js" defer></script>
<script src="js/issuers.js" defer></script>
<script src="js/match.js" defer></script>
<script src="js/recorte.js" defer></script>
<script src="js/receipt.js" defer></script>
<script src="js/gemini.js" defer></script>
<script src="js/drive.js" defer></script>
<script src="js/csv.js" defer></script>
<script src="js/graficos.js" defer></script>
<script src="js/credito.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
